      <h2>Registro de Nuevo Estudiante</h2>
    </div>

    <form action="#" method="POST">

      <!-- Bloque 1: Información Personal -->
      <fieldset>
        <legend>INFORMACION PERSONAL</legend>

        <div class="form-group">
          <label for="nombres">Nombres y Apellidos:</label>
          <input type="text" id="nombres" name="nombres" class="form-input" required placeholder="Richar Paredes">
        </div>

        <div class="form-group">
          <label for="codigo">Código de Estudiante (8 dígitos):</label>
          <input type="text" id="codigo" name="codigo" class="form-input" pattern="[0-9]{8}" required placeholder="20253212" title="Debe contener exactamente 8 números.">
        </div>

        <div class="form-group">
          <label for="fecha_nacimiento">Fecha de Nacimiento:</label>
          <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" class="form-input" min="1990-01-01" max="2010-12-31" required>
        </div>

        <div class="form-group">
          <label>Turno:</label>
          <div class="radio-group">
            <input type="radio" id="manana" name="turno" value="mañana" required>
            <label for="manana">Mañana</label>

            <input type="radio" id="noche" name="turno" value="noche" required>
            <label for="noche">Noche</label>
          </div>
        </div>
      </fieldset>

      <!-- Bloque 2: Información de la Cuenta -->
      <fieldset>
        <legend>INFORMACIÓN DE LA CUENTA</legend>

        <div class="form-group">
          <label for="email">Correo Institucional:</label>
          <input type="email" id="email" name="email" class="form-input" required placeholder="estudiante@unsa.edu.pe">
        </div>

        <div class="form-group">
          <label for="password">Contraseña:</label>
          <input type="password" id="password" name="password" class="form-input" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" required placeholder="Minímo 8 caracteres, 1 mayúscula y 1 número" title="Debe tener al menos 8 caracteres, incluyendo una letra mayúscula y un número.">
        </div>

        <div class="form-group">
          <label for="carrera">Carrera Profesional:</label>
          <select id="carrera" name="carrera" class="form-input" required>
            <option value="">-- Seleccione una Carrera --</option>
            <option value="sistemas" selected>Ingeniería de Sistemas</option>
            <option value="industrial">Ingeniería Industrial</option>
            <option value="civil">Ingeniería Civil</option>
            <option value="ambiental">Ingeniería Ambiental</option>
            <option value="matematicas">Matemáticas</option>
          </select>
        </div>

        <div class="form-group">
          <label for="comentarios">Comentarios Adicionales:</label>
          <textarea id="comentarios" name="comentarios" class="form-input" rows="3" placeholder="Escribe aquí cualquier observación..."></textarea>
        </div>

        <div class="form-group checkbox-group">
          <input type="checkbox" id="terminos" name="terminos" required>
          <label for="terminos">Acepto los términos y condiciones del sistema.</label>
        </div>
      </fieldset>

      <button type="submit" class="btn-submit">Registrar Estudiante</button>
    </form>
  </div>
</body>
