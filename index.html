<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Estudiantes</title>
  <!-- Enlace al archivo CSS externo -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Tarjeta contenedora principal -->
  <main class="card">
    <h2>Registro de Nuevos Estudiantes</h2>
    
    <form action="#" method="POST">

      <!-- BLOQUE 1: Información Personal -->
      <fieldset>
        <legend>Información Personal</legend>

        <!-- Código de estudiante (Validación: 8 números) -->
        <div class="form-group">
          <label for="codigo">Código de Estudiante:</label>
          <input type="text" id="codigo" name="codigo" required pattern="[0-9]{8}" placeholder="Ej. 12345678" title="Debe contener exactamente 8 dígitos numéricos">
        </div>

        <!-- Nombre completo -->
        <div class="form-group">
          <label for="nombre">Nombre Completo:</label>
          <input type="text" id="nombre" name="nombre" required placeholder="Juan Pérez">
        </div>

        <!-- Fecha de nacimiento (Validación: min y max) -->
        <div class="form-group">
          <label for="fecha_nacimiento">Fecha de Nacimiento:</label>
          <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" required min="1950-01-01" max="2008-12-31">
        </div>

        <!-- Edad (Campo deshabilitado / disabled) -->
        <div class="form-group">
          <label for="edad">Edad Calculada:</label>
          <input type="number" id="edad" name="edad" value="18" disabled>
        </div>

        <!-- Carrera Profesional (Select) -->
        <div class="form-group">
          <label for="carrera">Carrera Profesional:</label>
          <select id="carrera" name="carrera" required>
            <option value="">-- Seleccione una carrera --</option>
            <option value="sistemas">Ingeniería de Sistemas</option>
            <option value="industrial">Ingeniería Industrial</option>
            <option value="administracion">Administración de Empresas</option>
          </select>
        </div>

        <!-- Turno (Radio buttons) -->
        <div class="form-group">
          <label>Turno de Estudio:</label>
          <div class="options-inline">
            <input type="radio" id="manana" name="turno" value="Manana" required>
            <label for="manana">Mañana</label>

            <input type="radio" id="noche" name="turno" value="Noche">
            <label for="noche">Noche</label>
          </div>
        </div>

      </fieldset>

      <!-- BLOQUE 2: Información de la Cuenta -->
      <fieldset>
        <legend>Información de la Cuenta</legend>

        <!-- Email -->
        <div class="form-group">
          <label for="email">Correo Electrónico:</label>
          <input type="email" id="email" name="email" required placeholder="estudiante@correo.com">
        </div>

        <!-- Contraseña (Validación: min 8 caracteres, al menos 1 mayúscula y 1 número) -->
        <div class="form-group">
          <label for="password">Contraseña:</label>
          <input type="password" id="password" name="password" required pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" title="Mínimo 8 caracteres, al menos una mayúscula y un número">
        </div>

        <!-- Comentarios (Textarea) -->
        <div class="form-group">
          <label for="comentarios">Comentarios u Observaciones:</label>
          <textarea id="comentarios" name="comentarios" rows="3" placeholder="Ingresa algún detalle adicional..."></textarea>
        </div>

        <!-- Checkbox de Términos -->
        <div class="form-group checkbox-group">
          <input type="checkbox" id="terminos" name="terminos" required>
          <label for="terminos">Acepto los términos y condiciones</label>
        </div>

      </fieldset>

      <!-- Botón de envío -->
      <button type="submit" class="btn-submit">Registrar Estudiante</button>

    </form>
  </main>

</body>
</html>
