<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Estudiantes - Sistema Académico</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="card">
    <h2>Registro de Nuevo Estudiante</h2>
    <form action="#" method="POST">

      <!--Bloque 1: Informacion Personal-->
      <fieldset>
        <legend>Informacion Personal</legend>

        <div class="form-group">
          <label for="nombres">Nombres y Apellidos:</label>
          <input type="text" id="nombres" name="nombres" class="for-input" required placeholder="Richar Paredes">
        </div>

        <div class="form-group">
          <label for="codigo">Código de Estudiante (8 dígitos):</label>
          <input type="text" id="codigo" name="codigo" class="form-input" pattern="[0-9]{8}" required placeholder="20253212" title="Debe contener exactamente 8 numeros.">
        </div>

        
      </fieldset>
    </form>
  </div>
</body>
</html>
